name: speedcoach_app
description: "SpeedCoach Flutter App - Bluetooth control for ESP32C3 SpeedCoach rowing device"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^2.3.15
  permission_handler: ^13.0.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  xml: ^6.5.0
  csv: ^6.0.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  intl: ^0.19.0
  collection: ^1.18.0
  material_ui: ^1.1.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.2
  freezed: ^2.5.2
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true